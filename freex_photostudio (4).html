<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeX PhotoStudio</title>
    <!-- Favicon / Логотип вкладки -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2377C440'/><path d='M30 30 L70 30 L70 45 L48 45 L48 55 L65 55 L65 70 L48 70 L48 85 L30 85 Z' fill='%23ffffff'/></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#77C440',
                        'accent-hover': '#65a834',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
        }
        .checkerboard {
            background-color: #1e293b;
            background-image: 
                linear-gradient(45deg, #0f172a 25%, transparent 25%),
                linear-gradient(-45deg, #0f172a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #0f172a 75%),
                linear-gradient(-45deg, transparent 75%, #0f172a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .btn-tool {
            transition: all 0.15s ease;
        }
        .btn-tool.active {
            background-color: #77C440;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen w-screen flex flex-col overflow-hidden font-sans">

    <!-- ВЕРХНЕЕ МЕНЮ -->
    <header class="bg-slate-950 border-b border-slate-800 text-xs px-4 py-2 flex items-center justify-between select-none z-20 w-full">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2 font-bold text-lg text-white">
                <img src="logo.png" alt="FreeX PhotoStudio Logo" class="h-7 w-auto object-contain" onerror="this.src='https://placehold.co/100x40/77C440/ffffff?text=FreeX'">
                <span class="tracking-wide">FreeX PhotoStudio</span>
            </div>
            
            <div class="flex items-center space-x-2 text-slate-300">
                <!-- Файл -->
                <div class="relative group">
                    <button class="px-3 py-1 rounded hover:bg-slate-800 font-medium">Файл</button>
                    <div class="absolute left-0 top-full hidden group-hover:flex flex-col bg-slate-800 border border-slate-700 shadow-xl rounded py-1 w-52 z-50">
                        <button onclick="showNewCanvasPanel()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white flex justify-between items-center">
                            <span>Создать новый</span>
                        </button>
                        <label class="px-3 py-1.5 text-left hover:bg-accent hover:text-white cursor-pointer flex justify-between items-center">
                            <span>Открыть файл</span>
                            <input type="file" id="imageLoader" class="hidden" accept="image/*" onchange="loadImage(event)">
                        </label>
                        <hr class="border-slate-700 my-1">
                        <button onclick="openExportModal()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white flex justify-between items-center">
                            <span>Сохранить</span>
                        </button>
                    </div>
                </div>

                <!-- Редактировать -->
                <div class="relative group">
                    <button class="px-3 py-1 rounded hover:bg-slate-800 font-medium">Правка</button>
                    <div class="absolute left-0 top-full hidden group-hover:flex flex-col bg-slate-800 border border-slate-700 shadow-xl rounded py-1 w-48 z-50">
                        <button onclick="undo()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white">Отменить</button>
                        <button onclick="redo()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white">Повторить</button>
                        <hr class="border-slate-700 my-1">
                        <button onclick="copySelection()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white">Копировать выделение</button>
                        <button onclick="pasteSelection()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white">Вставить выделение</button>
                        <button onclick="clearSelectionContent()" class="px-3 py-1.5 text-left hover:bg-red-600 text-red-300 hover:text-white">Удалить выделенное</button>
                        <hr class="border-slate-700 my-1">
                        <button onclick="clearCurrentLayer()" class="px-3 py-1.5 text-left hover:bg-red-600 text-red-300 hover:text-white">Очистить слой</button>
                    </div>
                </div>

                <!-- Фильтры -->
                <div class="relative group">
                    <button class="px-3 py-1 rounded hover:bg-slate-800 font-medium">Фильтры</button>
                    <div class="absolute left-0 top-full hidden group-hover:flex flex-col bg-slate-800 border border-slate-700 shadow-xl rounded py-1 w-48 z-50">
                        <button onclick="applyFilter('invert')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white">Инверсия</button>
                        <button onclick="applyFilter('grayscale')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white">Черно-белое</button>
                        <button onclick="applyFilter('sepia')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white">Сепия</button>
                        <hr class="border-slate-700 my-1">
                        <button onclick="flipCanvas('h')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white">Отразить горизонтально</button>
                        <button onclick="flipCanvas('v')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-white">Отразить вертикально</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопки быстрых действий -->
        <div class="flex items-center space-x-2">
            <button onclick="undo()" title="Отмена" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-white">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button onclick="redo()" title="Повтор" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-white">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button onclick="openExportModal()" class="ml-2 bg-accent hover:bg-accent-hover text-white px-4 py-1.5 rounded font-medium text-xs flex items-center space-x-1.5">
                <i class="fa-solid fa-download"></i>
                <span>Экспорт</span>
            </button>
        </div>
    </header>

    <!-- ПАНЕЛЬ СВОЙСТВ ИНСТРУМЕНТА -->
    <div class="bg-slate-900 border-b border-slate-800 px-4 py-2 text-xs flex items-center space-x-6 text-slate-300 z-10 w-full overflow-x-auto">
        <!-- Кисть / Ластик настройки -->
        <div class="flex items-center space-x-2">
            <span class="text-slate-400">Размер:</span>
            <input type="range" id="brushSize" min="1" max="100" value="10" class="w-24 accent-accent">
            <span id="brushSizeVal" class="w-8 text-slate-400">10px</span>
        </div>

        <div class="flex items-center space-x-2">
            <span class="text-slate-400">Прозрачность:</span>
            <input type="range" id="brushOpacity" min="1" max="100" value="100" class="w-24 accent-accent">
            <span id="brushOpacityVal" class="w-8 text-slate-400">100%</span>
        </div>

        <!-- Панель управления выделением -->
        <div id="selectionOptions" class="hidden items-center space-x-2 border-l border-slate-700 pl-4">
            <button onclick="copySelection()" title="Копировать выделение" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded flex items-center space-x-1 border border-slate-700">
                <i class="fa-regular fa-copy"></i>
                <span>Копировать</span>
            </button>
            <button onclick="pasteSelection()" id="pasteBtn" title="Вставить выделенное" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded flex items-center space-x-1 border border-slate-700">
                <i class="fa-regular fa-paste"></i>
                <span>Вставить</span>
            </button>
            <button onclick="startMoveSelection()" title="Переместить выделенную область" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded flex items-center space-x-1 border border-slate-700">
                <i class="fa-solid fa-up-down-left-right"></i>
                <span>Переместить</span>
            </button>
            <button onclick="clearSelection()" title="Сбросить выделение" class="bg-slate-800 hover:bg-red-900/50 text-slate-300 hover:text-red-300 px-2 py-1 rounded border border-slate-700">
                <span>Сбросить</span>
            </button>
        </div>

        <!-- Выбор фигурой -->
        <div id="shapeOptions" class="hidden items-center space-x-4 border-l border-slate-700 pl-4">
            <div class="flex items-center space-x-2">
                <span class="text-slate-400">Фигура:</span>
                <select id="shapeType" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-white focus:outline-none">
                    <option value="rect">Прямоугольник</option>
                    <option value="circle">Круг</option>
                    <option value="line">Линия</option>
                    <option value="arrow">Стрелка</option>
                    <option value="star">Звезда</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-slate-400">Заливка:</span>
                <input type="checkbox" id="fillShape" class="rounded accent-accent w-4 h-4">
            </div>
        </div>

        <!-- Панель ввода текста -->
        <div id="textOptions" class="hidden items-center space-x-2 border-l border-slate-700 pl-4">
            <span class="text-slate-400">Текст:</span>
            <input type="text" id="textInput" placeholder="Введите текст..." class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-white w-36 focus:outline-none">
            <span class="text-slate-400">Размер:</span>
            <input type="number" id="fontSize" value="24" class="w-12 bg-slate-800 border border-slate-700 rounded px-1 py-1 text-white">
        </div>

        <!-- Панель создания холста -->
        <div id="newCanvasPanel" class="hidden items-center space-x-2 border-l border-slate-700 pl-4 bg-slate-800/90 p-1 rounded">
            <span class="text-slate-400">Ширина:</span>
            <input type="number" id="newCanvasW" value="1200" class="w-16 bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-white">
            <span class="text-slate-400">Высота:</span>
            <input type="number" id="newCanvasH" value="800" class="w-16 bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-white">
            <span class="text-slate-400">Фон:</span>
            <select id="newCanvasBg" class="bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-white">
                <option value="transparent">Прозрачный</option>
                <option value="white">Белый</option>
            </select>
            <button onclick="confirmNewCanvas()" class="bg-accent hover:bg-accent-hover text-white px-2 py-0.5 rounded">Создать</button>
            <button onclick="hideNewCanvasPanel()" class="text-slate-400 hover:text-white px-1">✕</button>
        </div>

        <!-- Информация о холсте -->
        <div class="ml-auto flex items-center space-x-4 text-slate-400 text-xs">
            <span id="canvasDim">1200 x 800 px</span>
            <span id="cursorPos">X: 0, Y: 0</span>
        </div>
    </div>

    <!-- ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ -->
    <div class="flex-1 flex overflow-hidden relative w-full">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ ИНСТРУМЕНТОВ -->
        <aside class="w-14 bg-slate-950 border-r border-slate-800 flex flex-col items-center py-3 space-y-2 z-10 select-none">
            <button onclick="setTool('move')" id="tool-move" title="Перемещение слоя" class="btn-tool active w-10 h-10 rounded-lg flex items-center justify-center hover:bg-slate-800 text-slate-300">
                <i class="fa-solid fa-arrows-up-down-left-right text-base"></i>
            </button>
            <button onclick="setTool('select')" id="tool-select" title="Выделение" class="btn-tool w-10 h-10 rounded-lg flex items-center justify-center hover:bg-slate-800 text-slate-300">
                <i class="fa-regular fa-square text-base"></i>
            </button>
            <button onclick="setTool('brush')" id="tool-brush" title="Кисть" class="btn-tool w-10 h-10 rounded-lg flex items-center justify-center hover:bg-slate-800 text-slate-300">
                <i class="fa-solid fa-paint-brush text-base"></i>
            </button>
            <button onclick="setTool('eraser')" id="tool-eraser" title="Ластик" class="btn-tool w-10 h-10 rounded-lg flex items-center justify-center hover:bg-slate-800 text-slate-300">
                <i class="fa-solid fa-eraser text-base"></i>
            </button>
            <button onclick="setTool('bucket')" id="tool-bucket" title="Заливка" class="btn-tool w-10 h-10 rounded-lg flex items-center justify-center hover:bg-slate-800 text-slate-300">
                <i class="fa-solid fa-fill-drip text-base"></i>
            </button>
            <button onclick="setTool('shapes')" id="tool-shapes" title="Фигуры" class="btn-tool w-10 h-10 rounded-lg flex items-center justify-center hover:bg-slate-800 text-slate-300">
                <i class="fa-shapes fa-solid text-base"></i>
            </button>
            <button onclick="setTool('text')" id="tool-text" title="Текст" class="btn-tool w-10 h-10 rounded-lg flex items-center justify-center hover:bg-slate-800 text-slate-300">
                <i class="fa-solid fa-font text-base"></i>
            </button>
            <button onclick="setTool('picker')" id="tool-picker" title="Пипетка" class="btn-tool w-10 h-10 rounded-lg flex items-center justify-center hover:bg-slate-800 text-slate-300">
                <i class="fa-solid fa-eye-dropper text-base"></i>
            </button>

            <hr class="w-8 border-slate-800 my-2">

            <!-- ВЫБОР ДВУХ ЦВЕТОВ (Primary & Secondary) -->
            <div class="relative w-10 h-10 flex items-center justify-center">
                <input type="color" id="secondaryColor" value="#ffffff" class="absolute bottom-0 right-0 w-6 h-6 rounded border border-slate-700 bg-transparent cursor-pointer z-0">
                <input type="color" id="primaryColor" value="#000000" class="absolute top-0 left-0 w-6 h-6 rounded border border-slate-700 bg-transparent cursor-pointer z-10">
                <button onclick="swapColors()" title="Поменять цвета местами" class="absolute -top-1 -right-1 text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full w-4 h-4 flex items-center justify-center z-20 border border-slate-600">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </aside>

        <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ - ХОЛСТ -->
        <main class="flex-1 relative overflow-auto checkerboard flex items-center justify-center p-8 w-full h-full" id="viewport">
            <div id="canvasContainer" class="relative shadow-2xl transition-transform duration-75">
                <!-- Слои и интерактивный слой предпросмотра рендерятся через JS -->
            </div>
        </main>

        <!-- ПРАВАЯ ПАНЕЛЬ СЛОЕВ И НАСТРОЕК -->
        <aside class="w-80 bg-slate-950 border-l border-slate-800 flex flex-col z-10 select-none">
            
            <!-- ВКЛАДКИ -->
            <div class="flex border-b border-slate-800 text-xs font-medium text-slate-400">
                <button id="tabLayersBtn" onclick="switchTab('layers')" class="flex-1 py-3 bg-slate-900 text-accent border-b-2 border-accent font-semibold">Слои</button>
                <button id="tabAdjBtn" onclick="switchTab('adj')" class="flex-1 py-3 hover:bg-slate-900 hover:text-slate-200">Коррекция</button>
            </div>

            <!-- ПАНЕЛЬ СЛОЕВ -->
            <div id="layersPanel" class="flex-1 flex flex-col p-4 overflow-hidden">
                <div class="flex items-center justify-between mb-3 text-xs space-x-2">
                    <span class="text-slate-400">Режим:</span>
                    <select id="blendMode" onchange="updateLayerBlendMode(this.value)" class="bg-slate-800 text-slate-200 rounded px-2 py-1 border border-slate-700 focus:outline-none flex-1">
                        <option value="normal">Обычный</option>
                        <option value="multiply">Умножение</option>
                        <option value="screen">Экран</option>
                        <option value="overlay">Перекрытие</option>
                        <option value="darken">Затемнение</option>
                        <option value="lighten">Замена светлым</option>
                    </select>
                </div>

                <div class="flex items-center space-x-2 mb-4 text-xs">
                    <span class="text-slate-400">Прозрачность:</span>
                    <input type="range" id="layerOpacity" min="0" max="100" value="100" oninput="updateLayerOpacity(this.value)" class="flex-1 accent-accent">
                    <span id="layerOpacityVal" class="text-slate-400 w-8 text-right">100%</span>
                </div>

                <!-- Список слоев -->
                <div id="layersList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <!-- Динамический список слоев -->
                </div>

                <!-- Кнопки управления слоями -->
                <div class="pt-3 border-t border-slate-800 flex items-center justify-between mt-2">
                    <div class="flex space-x-1">
                        <button onclick="addNewLayer()" title="Новый слой" class="p-2 hover:bg-slate-800 rounded text-slate-300">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <button onclick="duplicateActiveLayer()" title="Дублировать слой" class="p-2 hover:bg-slate-800 rounded text-slate-300">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <button onclick="moveLayerUp()" title="Переместить вверх" class="p-2 hover:bg-slate-800 rounded text-slate-300">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                        <button onclick="moveLayerDown()" title="Переместить вниз" class="p-2 hover:bg-slate-800 rounded text-slate-300">
                            <i class="fa-solid fa-arrow-down"></i>
                        </button>
                    </div>
                    <button onclick="deleteActiveLayer()" title="Удалить слой" class="p-2 hover:bg-red-900/50 hover:text-red-400 rounded text-slate-400">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- ПАНЕЛЬ КОРРЕКЦИИ -->
            <div id="adjustmentPanel" class="hidden flex-1 p-4 overflow-y-auto space-y-5 text-xs">
                <div>
                    <div class="flex justify-between text-slate-400 mb-1.5">
                        <span>Яркость</span>
                        <span id="brightnessVal">0</span>
                    </div>
                    <input type="range" id="adjBrightness" min="-100" max="100" value="0" oninput="applyAdjustments()" class="w-full accent-accent">
                </div>
                <div>
                    <div class="flex justify-between text-slate-400 mb-1.5">
                        <span>Контраст</span>
                        <span id="contrastVal">0</span>
                    </div>
                    <input type="range" id="adjContrast" min="-100" max="100" value="0" oninput="applyAdjustments()" class="w-full accent-accent">
                </div>
                <div>
                    <div class="flex justify-between text-slate-400 mb-1.5">
                        <span>Насыщенность</span>
                        <span id="saturateVal">0</span>
                    </div>
                    <input type="range" id="adjSaturate" min="-100" max="100" value="0" oninput="applyAdjustments()" class="w-full accent-accent">
                </div>
                <div>
                    <div class="flex justify-between text-slate-400 mb-1.5">
                        <span>Цветовой тон</span>
                        <span id="hueVal">0°</span>
                    </div>
                    <input type="range" id="adjHue" min="0" max="360" value="0" oninput="applyAdjustments()" class="w-full accent-accent">
                </div>
                <button onclick="resetAdjustments()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 font-medium">Сбросить настройки</button>
            </div>

        </aside>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЭКСПОРТА -->
    <div id="exportModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-w-md w-full p-6 text-slate-200">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <h3 class="text-base font-semibold">Сохранение изображения</h3>
                <button onclick="closeExportModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="py-4 space-y-4 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Имя файла:</label>
                    <input type="text" id="exportFileName" value="freex-artwork" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-accent">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">Формат файла:</label>
                    <select id="exportFormat" onchange="toggleQualitySlider()" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-accent">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="webp">WEBP</option>
                    </select>
                </div>

                <div id="qualityContainer" class="hidden">
                    <div class="flex justify-between text-slate-400 mb-1">
                        <span>Качество:</span>
                        <span id="exportQualityVal">90%</span>
                    </div>
                    <input type="range" id="exportQuality" min="10" max="100" value="90" oninput="document.getElementById('exportQualityVal').innerText = this.value + '%'" class="w-full accent-accent">
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-3 border-t border-slate-800">
                <button onclick="closeExportModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 text-xs font-medium">Отмена</button>
                <button onclick="downloadImage()" class="px-4 py-2 bg-accent hover:bg-accent-hover text-white rounded text-xs font-medium">Скачать</button>
            </div>
        </div>
    </div>

    <!-- JS ЛОГИКА ПРИЛОЖЕНИЯ -->
    <script>
        let canvasWidth = 1200;
        let canvasHeight = 800;
        let layers = [];
        let activeLayerIndex = -1;
        let currentTool = 'move';
        let isDrawing = false;
        let startX = 0, startY = 0;
        let dragImageData = null;
        let undoStack = [];
        let redoStack = [];
        const MAX_UNDO = 20;

        let activeSelection = null; // { x, y, width, height }
        let selectionBuffer = null; // Буфер для копирования/перемещения
        let isSelecting = false;
        let isMovingSelection = false;
        let isResizingSelection = false;
        let activeHandle = null; // 'nw', 'ne', 'se', 'sw'
        let selectionMoveOffset = { x: 0, y: 0 };
        let origSelectionRect = null;

        let previewCanvas = null;
        let previewCtx = null;

        const container = document.getElementById('canvasContainer');
        const brushSizeInput = document.getElementById('brushSize');
        const brushOpacityInput = document.getElementById('brushOpacity');
        const primaryColorInput = document.getElementById('primaryColor');
        const secondaryColorInput = document.getElementById('secondaryColor');

        window.onload = () => {
            initCanvas(1200, 800, 'transparent');
            setupEventListeners();
        };

        function setupEventListeners() {
            container.addEventListener('mousedown', (e) => {
                if (e.button === 1) { // Клик колесиком мыши
                    e.preventDefault();
                    swapColors();
                    return;
                }
                startDrawing(e);
            });

            window.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', stopDrawing);

            // Горячие клавиши (Delete, Ctrl+C, Ctrl+V, Ctrl+Z / Ctrl+Y, X)
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') {
                    return;
                }

                if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (activeSelection) {
                        e.preventDefault();
                        clearSelectionContent();
                    }
                } else if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'с')) {
                    e.preventDefault();
                    copySelection();
                } else if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'м')) {
                    e.preventDefault();
                    pasteSelection();
                } else if (e.key === 'x' || e.key === 'X' || e.key === 'ч' || e.key === 'Ч') {
                    swapColors();
                } else if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')) {
                    e.preventDefault();
                    if (e.shiftKey) redo();
                    else undo();
                } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'н')) {
                    e.preventDefault();
                    redo();
                }
            });

            brushSizeInput.addEventListener('input', (e) => {
                document.getElementById('brushSizeVal').innerText = e.target.value + 'px';
            });

            brushOpacityInput.addEventListener('input', (e) => {
                document.getElementById('brushOpacityVal').innerText = e.target.value + '%';
            });
        }

        function initCanvas(w, h, bgType = 'transparent') {
            canvasWidth = w;
            canvasHeight = h;
            container.style.width = w + 'px';
            container.style.height = h + 'px';
            document.getElementById('canvasDim').innerText = `${w} x ${h} px`;

            container.innerHTML = '';
            layers = [];
            undoStack = [];
            redoStack = [];
            activeSelection = null;
            selectionBuffer = null;

            addNewLayer('Слой 1', bgType === 'white');

            previewCanvas = document.createElement('canvas');
            previewCanvas.width = canvasWidth;
            previewCanvas.height = canvasHeight;
            previewCanvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none z-30';
            previewCtx = previewCanvas.getContext('2d');
            container.appendChild(previewCanvas);

            saveState();
        }

        function addNewLayer(name = null, isWhiteBackground = false) {
            const layerCanvas = document.createElement('canvas');
            layerCanvas.width = canvasWidth;
            layerCanvas.height = canvasHeight;
            layerCanvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none';
            
            const ctx = layerCanvas.getContext('2d');
            if (isWhiteBackground) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            }

            const layer = {
                id: Date.now() + Math.random(),
                name: name || `Слой ${layers.length + 1}`,
                canvas: layerCanvas,
                ctx: ctx,
                visible: true,
                opacity: 1,
                blendMode: 'normal'
            };

            layers.push(layer);
            
            if (previewCanvas && previewCanvas.parentNode === container) {
                container.insertBefore(layerCanvas, previewCanvas);
            } else {
                container.appendChild(layerCanvas);
            }

            setActiveLayer(layers.length - 1);
            renderLayersControl();
        }

        function setActiveLayer(index) {
            if (index >= 0 && index < layers.length) {
                activeLayerIndex = index;
                renderLayersControl();
                updateLayerControlsUI();
            }
        }

        function renderLayersControl() {
            const list = document.getElementById('layersList');
            list.innerHTML = '';

            for (let i = layers.length - 1; i >= 0; i--) {
                const layer = layers[i];
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2.5 rounded-lg cursor-pointer border ${
                    i === activeLayerIndex 
                        ? 'bg-accent/20 border-accent text-white font-medium' 
                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:bg-slate-800'
                }`;
                item.onclick = () => setActiveLayer(i);

                item.innerHTML = `
                    <div class="flex items-center space-x-2.5 truncate">
                        <button onclick="toggleLayerVisibility(${i}, event)" class="hover:text-white">
                            <i class="fa-solid ${layer.visible ? 'fa-eye' : 'fa-eye-slash text-slate-600'}"></i>
                        </button>
                        <span class="text-xs truncate">${layer.name}</span>
                    </div>
                    <span class="text-xs text-slate-500">${Math.round(layer.opacity * 100)}%</span>
                `;
                list.appendChild(item);
            }
        }

        function renderSelection() {
            if (!previewCtx) return;
            previewCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            if (activeSelection) {
                const { x, y, width, height } = activeSelection;
                
                previewCtx.save();
                // Синий пунктирный контур выделения
                previewCtx.strokeStyle = '#3b82f6';
                previewCtx.lineWidth = 2;
                previewCtx.setLineDash([6, 6]);
                previewCtx.strokeRect(x, y, width, height);

                // Светло-синяя прозрачная заливка
                previewCtx.fillStyle = 'rgba(59, 130, 246, 0.12)';
                previewCtx.fillRect(x, y, width, height);

                // Отрисовка маркеров изменения размера по углам
                const handleSize = 8;
                previewCtx.fillStyle = '#3b82f6';
                previewCtx.strokeStyle = '#ffffff';
                previewCtx.lineWidth = 1;
                previewCtx.setLineDash([]);

                const handles = [
                    { x: x, y: y },                      // NW
                    { x: x + width, y: y },              // NE
                    { x: x + width, y: y + height },      // SE
                    { x: x, y: y + height }               // SW
                ];

                handles.forEach(h => {
                    previewCtx.beginPath();
                    previewCtx.rect(h.x - handleSize / 2, h.y - handleSize / 2, handleSize, handleSize);
                    previewCtx.fill();
                    previewCtx.stroke();
                });

                previewCtx.restore();
            }
        }

        function clearSelection() {
            activeSelection = null;
            renderSelection();
        }

        function clearSelectionContent() {
            if (!activeSelection || activeLayerIndex < 0) return;
            const ctx = layers[activeLayerIndex].ctx;
            ctx.clearRect(activeSelection.x, activeSelection.y, activeSelection.width, activeSelection.height);
            saveState();
        }

        function copySelection() {
            if (!activeSelection || activeLayerIndex < 0) return;
            const ctx = layers[activeLayerIndex].ctx;
            const { x, y, width, height } = activeSelection;
            if (width > 0 && height > 0) {
                selectionBuffer = ctx.getImageData(x, y, width, height);
            }
        }

        function pasteSelection() {
            if (!selectionBuffer) return;
            
            addNewLayer('Вставленный фрагмент');
            const newCtx = layers[activeLayerIndex].ctx;
            
            const pasteX = activeSelection ? activeSelection.x : Math.max(0, (canvasWidth - selectionBuffer.width) / 2);
            const pasteY = activeSelection ? activeSelection.y : Math.max(0, (canvasHeight - selectionBuffer.height) / 2);

            newCtx.putImageData(selectionBuffer, pasteX, pasteY);
            
            activeSelection = {
                x: pasteX,
                y: pasteY,
                width: selectionBuffer.width,
                height: selectionBuffer.height
            };
            
            renderSelection();
            saveState();
        }

        function startMoveSelection() {
            if (!activeSelection || activeLayerIndex < 0) return;
            copySelection();
            clearSelectionContent();
            setTool('move');
        }

        function checkHandleClick(pos) {
            if (!activeSelection) return null;
            const { x, y, width, height } = activeSelection;
            const handleSize = 10;

            const handles = {
                'nw': { x: x, y: y },
                'ne': { x: x + width, y: y },
                'se': { x: x + width, y: y + height },
                'sw': { x: x, y: y + height }
            };

            for (let handle in handles) {
                const h = handles[handle];
                if (Math.abs(pos.x - h.x) <= handleSize && Math.abs(pos.y - h.y) <= handleSize) {
                    return handle;
                }
            }
            return null;
        }

        function startDrawing(e) {
            if (e.button !== 0) return;
            if (activeLayerIndex < 0 || !layers[activeLayerIndex].visible) return;
            
            const pos = getCanvasCoordinates(e);
            if (pos.x < 0 || pos.x > canvasWidth || pos.y < 0 || pos.y > canvasHeight) return;

            isDrawing = true;
            startX = pos.x;
            startY = pos.y;

            const ctx = layers[activeLayerIndex].ctx;

            if (currentTool === 'select') {
                // Проверка клика по маркеру изменения размера
                const clickedHandle = checkHandleClick(pos);
                if (clickedHandle) {
                    isResizingSelection = true;
                    activeHandle = clickedHandle;
                    origSelectionRect = { ...activeSelection };
                    return;
                }

                // Проверка клика внутри выделения для перемещения
                if (activeSelection) {
                    const inside = pos.x >= activeSelection.x && pos.x <= activeSelection.x + activeSelection.width &&
                                   pos.y >= activeSelection.y && pos.y <= activeSelection.y + activeSelection.height;
                    if (inside) {
                        isMovingSelection = true;
                        selectionMoveOffset = {
                            x: pos.x - activeSelection.x,
                            y: pos.y - activeSelection.y
                        };
                        return;
                    } else {
                        clearSelection();
                    }
                }

                isSelecting = true;
            } else if (currentTool === 'move') {
                dragImageData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            } else if (currentTool === 'picker') {
                pickColor(pos.x, pos.y);
                isDrawing = false;
            } else if (currentTool === 'bucket') {
                floodFill(Math.floor(pos.x), Math.floor(pos.y), primaryColorInput.value);
                isDrawing = false;
                saveState();
            } else if (currentTool === 'text') {
                drawTextToCanvas(pos.x, pos.y);
                isDrawing = false;
            } else if (currentTool === 'brush' || currentTool === 'eraser') {
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }
        }

        function draw(e) {
            const pos = getCanvasCoordinates(e);
            document.getElementById('cursorPos').innerText = `X: ${Math.round(pos.x)}, Y: ${Math.round(pos.y)}`;

            if (!isDrawing || activeLayerIndex < 0) return;

            const ctx = layers[activeLayerIndex].ctx;
            const size = brushSizeInput.value;
            const opacity = brushOpacityInput.value / 100;
            const color = primaryColorInput.value;

            if (currentTool === 'select') {
                if (isResizingSelection && activeSelection && origSelectionRect) {
                    let { x, y, width, height } = origSelectionRect;

                    if (activeHandle === 'se') {
                        width = Math.max(10, pos.x - x);
                        height = Math.max(10, pos.y - y);
                    } else if (activeHandle === 'sw') {
                        const newWidth = Math.max(10, (x + width) - pos.x);
                        x = (x + width) - newWidth;
                        width = newWidth;
                        height = Math.max(10, pos.y - y);
                    } else if (activeHandle === 'ne') {
                        width = Math.max(10, pos.x - x);
                        const newHeight = Math.max(10, (y + height) - pos.y);
                        y = (y + height) - newHeight;
                        height = newHeight;
                    } else if (activeHandle === 'nw') {
                        const newWidth = Math.max(10, (x + width) - pos.x);
                        x = (x + width) - newWidth;
                        width = newWidth;
                        const newHeight = Math.max(10, (y + height) - pos.y);
                        y = (y + height) - newHeight;
                        height = newHeight;
                    }

                    activeSelection = { x, y, width, height };
                    renderSelection();
                } else if (isMovingSelection && activeSelection) {
                    activeSelection.x = pos.x - selectionMoveOffset.x;
                    activeSelection.y = pos.y - selectionMoveOffset.y;
                    renderSelection();
                } else if (isSelecting) {
                    const w = pos.x - startX;
                    const h = pos.y - startY;
                    activeSelection = {
                        x: Math.min(startX, pos.x),
                        y: Math.min(startY, pos.y),
                        width: Math.abs(w),
                        height: Math.abs(h)
                    };
                    renderSelection();
                }
            } else if (currentTool === 'move' && dragImageData) {
                const dx = pos.x - startX;
                const dy = pos.y - startY;
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                ctx.putImageData(dragImageData, dx, dy);
            } else if (currentTool === 'brush') {
                ctx.globalAlpha = opacity;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentTool === 'eraser') {
                ctx.globalAlpha = opacity;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = size;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentTool === 'shapes') {
                previewCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                if (activeSelection) renderSelection();
                drawShapeOnContext(previewCtx, startX, startY, pos.x, pos.y);
            }
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;

            if (currentTool === 'select') {
                isSelecting = false;
                isMovingSelection = false;
                isResizingSelection = false;
                activeHandle = null;

                if (activeSelection && (activeSelection.width < 3 || activeSelection.height < 3)) {
                    clearSelection();
                } else {
                    renderSelection();
                }
            } else if (activeLayerIndex >= 0) {
                const ctx = layers[activeLayerIndex].ctx;
                ctx.globalCompositeOperation = 'source-over';

                if (currentTool === 'shapes' && e) {
                    const pos = getCanvasCoordinates(e);
                    previewCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                    renderSelection();
                    drawShapeOnContext(ctx, startX, startY, pos.x, pos.y);
                }
            }

            dragImageData = null;
            saveState();
        }

        function restoreState(state) {
            container.innerHTML = '';
            layers = [];

            state.forEach((s) => {
                const layerCanvas = document.createElement('canvas');
                layerCanvas.width = canvasWidth;
                layerCanvas.height = canvasHeight;
                layerCanvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none';
                layerCanvas.style.opacity = s.opacity;
                layerCanvas.style.mixBlendMode = s.blendMode;
                layerCanvas.style.display = s.visible ? 'block' : 'none';

                const ctx = layerCanvas.getContext('2d');
                ctx.putImageData(s.data, 0, 0);

                const layer = {
                    id: s.id,
                    name: s.name,
                    canvas: layerCanvas,
                    ctx: ctx,
                    visible: s.visible,
                    opacity: s.opacity,
                    blendMode: s.blendMode
                };

                layers.push(layer);
                container.appendChild(layerCanvas);
            });

            previewCanvas = document.createElement('canvas');
            previewCanvas.width = canvasWidth;
            previewCanvas.height = canvasHeight;
            previewCanvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none z-30';
            previewCtx = previewCanvas.getContext('2d');
            container.appendChild(previewCanvas);

            activeLayerIndex = Math.min(activeLayerIndex, layers.length - 1);
            renderLayersControl();
            renderSelection();
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`tool-${tool}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('selectionOptions').style.display = (tool === 'select') ? 'flex' : 'none';
            document.getElementById('shapeOptions').style.display = (tool === 'shapes') ? 'flex' : 'none';
            document.getElementById('textOptions').style.display = (tool === 'text') ? 'flex' : 'none';
        }

        function toggleLayerVisibility(index, e) {
            e.stopPropagation();
            layers[index].visible = !layers[index].visible;
            layers[index].canvas.style.display = layers[index].visible ? 'block' : 'none';
            renderLayersControl();
        }

        function updateLayerControlsUI() {
            if (activeLayerIndex < 0) return;
            const layer = layers[activeLayerIndex];
            document.getElementById('layerOpacity').value = layer.opacity * 100;
            document.getElementById('layerOpacityVal').innerText = Math.round(layer.opacity * 100) + '%';
            document.getElementById('blendMode').value = layer.blendMode;
        }

        function updateLayerOpacity(val) {
            if (activeLayerIndex < 0) return;
            const opacity = val / 100;
            layers[activeLayerIndex].opacity = opacity;
            layers[activeLayerIndex].canvas.style.opacity = opacity;
            document.getElementById('layerOpacityVal').innerText = val + '%';
            renderLayersControl();
        }

        function updateLayerBlendMode(val) {
            if (activeLayerIndex < 0) return;
            layers[activeLayerIndex].blendMode = val;
            layers[activeLayerIndex].canvas.style.mixBlendMode = val;
        }

        function moveLayerUp() {
            if (activeLayerIndex < layers.length - 1) {
                const temp = layers[activeLayerIndex];
                layers[activeLayerIndex] = layers[activeLayerIndex + 1];
                layers[activeLayerIndex + 1] = temp;
                reorderCanvasDOM();
                setActiveLayer(activeLayerIndex + 1);
            }
        }

        function moveLayerDown() {
            if (activeLayerIndex > 0) {
                const temp = layers[activeLayerIndex];
                layers[activeLayerIndex] = layers[activeLayerIndex - 1];
                layers[activeLayerIndex - 1] = temp;
                reorderCanvasDOM();
                setActiveLayer(activeLayerIndex - 1);
            }
        }

        function reorderCanvasDOM() {
            layers.forEach(l => container.appendChild(l.canvas));
            if (previewCanvas) container.appendChild(previewCanvas);
        }

        function deleteActiveLayer() {
            if (layers.length <= 1) return;
            container.removeChild(layers[activeLayerIndex].canvas);
            layers.splice(activeLayerIndex, 1);
            setActiveLayer(Math.max(0, activeLayerIndex - 1));
            saveState();
        }

        function duplicateActiveLayer() {
            if (activeLayerIndex < 0) return;
            const src = layers[activeLayerIndex];
            addNewLayer(`${src.name} дубликат`);
            const dest = layers[activeLayerIndex];
            dest.ctx.drawImage(src.canvas, 0, 0);
            saveState();
        }

        function swapColors() {
            const temp = primaryColorInput.value;
            primaryColorInput.value = secondaryColorInput.value;
            secondaryColorInput.value = temp;
        }

        function getCanvasCoordinates(e) {
            const rect = container.getBoundingClientRect();
            const scaleX = canvasWidth / rect.width;
            const scaleY = canvasHeight / rect.height;

            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function drawShapeOnContext(targetCtx, x1, y1, x2, y2) {
            const shapeType = document.getElementById('shapeType').value;
            const fill = document.getElementById('fillShape').checked;
            const color = primaryColorInput.value;
            const size = brushSizeInput.value;
            const opacity = brushOpacityInput.value / 100;

            targetCtx.save();
            targetCtx.globalAlpha = opacity;
            targetCtx.strokeStyle = color;
            targetCtx.fillStyle = color;
            targetCtx.lineWidth = size;
            targetCtx.lineCap = 'round';

            const w = x2 - x1;
            const h = y2 - y1;

            targetCtx.beginPath();

            if (shapeType === 'rect') {
                if (fill) targetCtx.fillRect(x1, y1, w, h);
                else targetCtx.strokeRect(x1, y1, w, h);
            } else if (shapeType === 'circle') {
                const rx = Math.abs(w) / 2;
                const ry = Math.abs(h) / 2;
                const cx = x1 + w / 2;
                const cy = y1 + h / 2;
                targetCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                if (fill) targetCtx.fill();
                else targetCtx.stroke();
            } else if (shapeType === 'line') {
                targetCtx.moveTo(x1, y1);
                targetCtx.lineTo(x2, y2);
                targetCtx.stroke();
            } else if (shapeType === 'arrow') {
                const headlen = Math.max(10, size * 2);
                const angle = Math.atan2(y2 - y1, x2 - x1);
                targetCtx.moveTo(x1, y1);
                targetCtx.lineTo(x2, y2);
                targetCtx.stroke();
                
                targetCtx.beginPath();
                targetCtx.moveTo(x2, y2);
                targetCtx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
                targetCtx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
                targetCtx.closePath();
                targetCtx.fill();
            } else if (shapeType === 'star') {
                const cx = x1 + w / 2;
                const cy = y1 + h / 2;
                const outerRadius = Math.min(Math.abs(w), Math.abs(h)) / 2;
                const innerRadius = outerRadius / 2;
                const spikes = 5;

                let rot = Math.PI / 2 * 3;
                let step = Math.PI / spikes;

                targetCtx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    targetCtx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                    rot += step;
                    targetCtx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                    rot += step;
                }
                targetCtx.lineTo(cx, cy - outerRadius);
                targetCtx.closePath();

                if (fill) targetCtx.fill();
                else targetCtx.stroke();
            }

            targetCtx.restore();
        }

        function drawTextToCanvas(x, y) {
            const text = document.getElementById('textInput').value;
            const fontSize = document.getElementById('fontSize').value || 24;
            if (!text) return;

            const ctx = layers[activeLayerIndex].ctx;
            ctx.font = `${fontSize}px Inter, sans-serif`;
            ctx.fillStyle = primaryColorInput.value;
            ctx.globalAlpha = brushOpacityInput.value / 100;
            ctx.fillText(text, x, y);
            saveState();
        }

        function floodFill(startX, startY, fillColorHex) {
            const ctx = layers[activeLayerIndex].ctx;
            const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            const data = imgData.data;

            const targetPos = (startY * canvasWidth + startX) * 4;
            const startR = data[targetPos];
            const startG = data[targetPos + 1];
            const startB = data[targetPos + 2];
            const startA = data[targetPos + 3];

            const r = parseInt(fillColorHex.slice(1, 3), 16);
            const g = parseInt(fillColorHex.slice(3, 5), 16);
            const b = parseInt(fillColorHex.slice(5, 7), 16);

            if (startR === r && startG === g && startB === b && startA === 255) return;

            const pixelStack = [[startX, startY]];

            while (pixelStack.length) {
                const newPos = pixelStack.pop();
                const x = newPos[0];
                let y = newPos[1];

                let pixelPos = (y * canvasWidth + x) * 4;
                while (y >= 0 && matchStartColor(pixelPos)) {
                    y--;
                    pixelPos -= canvasWidth * 4;
                }
                pixelPos += canvasWidth * 4;
                y++;

                let reachLeft = false;
                let reachRight = false;

                while (y < canvasHeight && matchStartColor(pixelPos)) {
                    colorPixel(pixelPos, r, g, b);

                    if (x > 0) {
                        if (matchStartColor(pixelPos - 4)) {
                            if (!reachLeft) {
                                pixelStack.push([x - 1, y]);
                                reachLeft = true;
                            }
                        } else if (reachLeft) {
                            reachLeft = false;
                        }
                    }

                    if (x < canvasWidth - 1) {
                        if (matchStartColor(pixelPos + 4)) {
                            if (!reachRight) {
                                pixelStack.push([x + 1, y]);
                                reachRight = true;
                            }
                        } else if (reachRight) {
                            reachRight = false;
                        }
                    }

                    y++;
                    pixelPos += canvasWidth * 4;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            function matchStartColor(pixelPos) {
                return data[pixelPos] === startR &&
                       data[pixelPos + 1] === startG &&
                       data[pixelPos + 2] === startB &&
                       data[pixelPos + 3] === startA;
            }

            function colorPixel(pixelPos, r, g, b) {
                data[pixelPos] = r;
                data[pixelPos + 1] = g;
                data[pixelPos + 2] = b;
                data[pixelPos + 3] = 255;
            }
        }

        function pickColor(x, y) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasWidth;
            tempCanvas.height = canvasHeight;
            const tempCtx = tempCanvas.getContext('2d');

            layers.forEach(layer => {
                if (layer.visible) tempCtx.drawImage(layer.canvas, 0, 0);
            });

            const pixel = tempCtx.getImageData(x, y, 1, 1).data;
            const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
            primaryColorInput.value = hex;
        }

        function applyFilter(filterType) {
            if (activeLayerIndex < 0) return;
            const ctx = layers[activeLayerIndex].ctx;
            const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                if (filterType === 'invert') {
                    data[i] = 255 - data[i];
                    data[i + 1] = 255 - data[i + 1];
                    data[i + 2] = 255 - data[i + 2];
                } else if (filterType === 'grayscale') {
                    const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    data[i] = avg;
                    data[i + 1] = avg;
                    data[i + 2] = avg;
                } else if (filterType === 'sepia') {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    data[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    data[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    data[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                }
            }

            ctx.putImageData(imgData, 0, 0);
            saveState();
        }

        function flipCanvas(direction) {
            if (activeLayerIndex < 0) return;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasWidth;
            tempCanvas.height = canvasHeight;
            const tempCtx = tempCanvas.getContext('2d');
            
            const ctx = layers[activeLayerIndex].ctx;
            tempCtx.drawImage(layers[activeLayerIndex].canvas, 0, 0);

            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.save();
            if (direction === 'h') {
                ctx.scale(-1, 1);
                ctx.drawImage(tempCanvas, -canvasWidth, 0);
            } else {
                ctx.scale(1, -1);
                ctx.drawImage(tempCanvas, 0, -canvasHeight);
            }
            ctx.restore();
            saveState();
        }

        function loadImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    initCanvas(img.width, img.height, 'transparent');
                    layers[0].ctx.drawImage(img, 0, 0);
                    saveState();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function clearCurrentLayer() {
            if (activeLayerIndex < 0) return;
            layers[activeLayerIndex].ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            saveState();
        }

        function saveState() {
            if (undoStack.length >= MAX_UNDO) undoStack.shift();
            
            const snapshot = layers.map(l => ({
                id: l.id,
                name: l.name,
                visible: l.visible,
                opacity: l.opacity,
                blendMode: l.blendMode,
                data: l.ctx.getImageData(0, 0, canvasWidth, canvasHeight)
            }));

            undoStack.push(snapshot);
            redoStack = [];
        }

        function undo() {
            if (undoStack.length <= 1) return;
            redoStack.push(undoStack.pop());
            restoreState(undoStack[undoStack.length - 1]);
        }

        function redo() {
            if (redoStack.length === 0) return;
            const state = redoStack.pop();
            undoStack.push(state);
            restoreState(state);
        }

        function openExportModal() {
            document.getElementById('exportModal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
        }

        function toggleQualitySlider() {
            const format = document.getElementById('exportFormat').value;
            const container = document.getElementById('qualityContainer');
            container.style.display = (format === 'jpeg' || format === 'webp') ? 'block' : 'none';
        }

        function downloadImage() {
            const format = document.getElementById('exportFormat').value;
            const filename = document.getElementById('exportFileName').value || 'freex-artwork';
            const quality = document.getElementById('exportQuality').value / 100;

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvasWidth;
            exportCanvas.height = canvasHeight;
            const exportCtx = exportCanvas.getContext('2d');

            if (format === 'jpeg') {
                exportCtx.fillStyle = '#ffffff';
                exportCtx.fillRect(0, 0, canvasWidth, canvasHeight);
            }

            layers.forEach(layer => {
                if (layer.visible) {
                    exportCtx.globalAlpha = layer.opacity;
                    exportCtx.globalCompositeOperation = layer.blendMode;
                    exportCtx.drawImage(layer.canvas, 0, 0);
                }
            });

            const link = document.createElement('a');
            const mimeType = `image/${format}`;
            link.download = `${filename}.${format}`;
            link.href = exportCanvas.toDataURL(mimeType, quality);
            link.click();

            closeExportModal();
        }

        function switchTab(tab) {
            const lPanel = document.getElementById('layersPanel');
            const aPanel = document.getElementById('adjustmentPanel');
            const lBtn = document.getElementById('tabLayersBtn');
            const aBtn = document.getElementById('tabAdjBtn');

            if (tab === 'adj') {
                aPanel.classList.remove('hidden');
                lPanel.classList.add('hidden');
                aBtn.className = "flex-1 py-3 bg-slate-900 text-accent border-b-2 border-accent font-semibold";
                lBtn.className = "flex-1 py-3 hover:bg-slate-900 hover:text-slate-200 text-slate-400";
            } else {
                aPanel.classList.add('hidden');
                lPanel.classList.remove('hidden');
                lBtn.className = "flex-1 py-3 bg-slate-900 text-accent border-b-2 border-accent font-semibold";
                aBtn.className = "flex-1 py-3 hover:bg-slate-900 hover:text-slate-200 text-slate-400";
            }
        }

        function applyAdjustments() {
            const b = document.getElementById('adjBrightness').value;
            const c = document.getElementById('adjContrast').value;
            const s = document.getElementById('adjSaturate').value;
            const h = document.getElementById('adjHue').value;

            document.getElementById('brightnessVal').innerText = b;
            document.getElementById('contrastVal').innerText = c;
            document.getElementById('saturateVal').innerText = s;
            document.getElementById('hueVal').innerText = h + '°';

            if (activeLayerIndex >= 0) {
                layers[activeLayerIndex].canvas.style.filter = 
                    `brightness(${100 + parseInt(b)}%) contrast(${100 + parseInt(c)}%) saturate(${100 + parseInt(s)}%) hue-rotate(${h}deg)`;
            }
        }

        function resetAdjustments() {
            document.getElementById('adjBrightness').value = 0;
            document.getElementById('adjContrast').value = 0;
            document.getElementById('adjSaturate').value = 0;
            document.getElementById('adjHue').value = 0;
            applyAdjustments();
        }

        function showNewCanvasPanel() {
            document.getElementById('newCanvasPanel').classList.remove('hidden');
            document.getElementById('newCanvasPanel').classList.add('flex');
        }

        function hideNewCanvasPanel() {
            document.getElementById('newCanvasPanel').classList.add('hidden');
            document.getElementById('newCanvasPanel').classList.remove('flex');
        }

        function confirmNewCanvas() {
            const w = parseInt(document.getElementById('newCanvasW').value) || 1200;
            const h = parseInt(document.getElementById('newCanvasH').value) || 800;
            const bg = document.getElementById('newCanvasBg').value;
            initCanvas(w, h, bg);
            hideNewCanvasPanel();
        }
    </script>
</body>
