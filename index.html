<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FreeX PhotoStudio</title>
    <!-- Favicon / Логотип вкладки -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: '#77C440',
                        'accent-hover': '#88d450',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .impact-font {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-style: italic;
        }

        .photo-text {
            color: #ffffff;
        }

        .hover-logo-img {
            display: inline-block;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
            cursor: pointer;
        }
        .hover-logo-img:hover {
            transform: scale(1.15) rotate(-3deg);
            filter: drop-shadow(0 0 10px rgba(119, 196, 64, 0.6));
        }

        .hover-letter {
            display: inline-block;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease, filter 0.2s ease;
            cursor: pointer;
            user-select: none;
            padding: 0 0.5px;
        }
        .hover-letter:hover {
            transform: scale(1.35) translateY(-2px);
            filter: brightness(1.25);
        }
        .letter-highlight {
            color: #77C440;
            text-shadow: 0 0 12px rgba(119, 196, 64, 0.4);
        }
        
        /* Сверхтемная темная тема */
        .dark body, .dark header, .dark aside, .dark div[role="region"] {
            background-color: #000000 !important;
            color: #e2e8f0;
        }

        /* Прозрачная шахматка для темной темы */
        .dark .checkerboard {
            background-color: #050505;
            background-image: 
                linear-gradient(45deg, #0d0d0f 25%, transparent 25%),
                linear-gradient(-45deg, #0d0d0f 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #0d0d0f 75%),
                linear-gradient(-45deg, transparent 75%, #0d0d0f 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* Прозрачная шахматка для светлой темы */
        .checkerboard {
            background-color: #f1f5f9;
            background-image: 
                linear-gradient(45deg, #cbd5e1 25%, transparent 25%),
                linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
                linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.1);
        }
        .dark ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #1c1c1e;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #2c2c2e;
        }
        .btn-tool {
            transition: all 0.15s ease;
        }
        .btn-tool.active {
            background-color: #77C440;
            color: #000000 !important;
        }

        /* Маркеры изменения размера окна холста */
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #77C440;
            border: 2px solid #ffffff;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            border-radius: 2px;
            z-index: 40;
        }
        .resize-handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .resize-handle.n  { top: -6px; left: calc(50% - 6px); cursor: ns-resize; }
        .resize-handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .resize-handle.e  { top: calc(50% - 6px); right: -6px; cursor: ew-resize; }
        .resize-handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }
        .resize-handle.s  { bottom: -6px; left: calc(50% - 6px); cursor: ns-resize; }
        .resize-handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .resize-handle.w  { top: calc(50% - 6px); left: -6px; cursor: ew-resize; }

        .canvas-wrapper {
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.5);
            border: 1px dashed rgba(119, 196, 64, 0.6);
        }

        /* Разделители для изменения размеров панелей ПК */
        .sidebar-resizer {
            width: 4px;
            cursor: col-resize;
            background-color: transparent;
            transition: background-color 0.2s ease;
            z-index: 30;
        }
        .sidebar-resizer:hover, .sidebar-resizer.resizing {
            background-color: #77C440;
        }

        /* Мобильные улучшения */
        @media (max-width: 768px) {
            .mobile-panel-overlay {
                transition: transform 0.3s ease-in-out;
            }
            .mobile-panel-hidden {
                transform: translateY(100%);
            }
            .pc-only-flex {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-black text-slate-800 dark:text-slate-200 h-screen w-screen flex flex-col overflow-hidden font-sans transition-colors duration-200">

    <!-- ВЕРХНЕЕ МЕНЮ -->
    <header class="bg-white dark:bg-black border-b border-slate-200 dark:border-zinc-900 text-xs px-2 md:px-4 py-2 flex items-center justify-between select-none z-20 w-full transition-colors duration-200 flex-wrap gap-2">
        <div class="flex items-center space-x-3 md:space-x-6">
            <!-- Блок логотипа -->
            <div class="flex items-center space-x-2 cursor-pointer group" onclick="window.location.href='index.html'">
                <img src="logo.png" alt="FreeX Logo" class="h-6 md:h-8 w-auto object-contain hover-logo-img" onerror="this.src='https://placehold.co/100x40/77C440/000000?text=FreeX'">
                <div class="flex items-center text-lg md:text-2xl tracking-wide impact-font">
                    <div class="flex items-center">
                        <span class="hover-letter text-slate-900 dark:text-white">F</span>
                        <span class="hover-letter text-slate-900 dark:text-white">R</span>
                        <span class="hover-letter text-slate-900 dark:text-white">E</span>
                        <span class="hover-letter text-slate-900 dark:text-white">E</span>
                        <span class="hover-letter letter-highlight">X</span>
                    </div>
                    <div class="hidden sm:flex items-center ml-2">
                        <span class="hover-letter photo-text">P</span>
                        <span class="hover-letter photo-text">H</span>
                        <span class="hover-letter photo-text">O</span>
                        <span class="hover-letter photo-text">T</span>
                        <span class="hover-letter photo-text">O</span>
                        <span class="hover-letter letter-highlight">S</span>
                        <span class="hover-letter letter-highlight">T</span>
                        <span class="hover-letter letter-highlight">U</span>
                        <span class="hover-letter letter-highlight">D</span>
                        <span class="hover-letter letter-highlight">I</span>
                        <span class="hover-letter letter-highlight">O</span>
                    </div>
                </div>
            </div>
            
            <!-- Главное меню (Файл, Правка, Фильтры) -->
            <div class="flex items-center space-x-1 md:space-x-2 text-slate-700 dark:text-slate-300">
                <!-- Файл -->
                <div class="relative group">
                    <button class="px-2 md:px-3 py-1 rounded hover:bg-slate-100 dark:hover:bg-zinc-900 font-medium">Файл</button>
                    <div class="absolute left-0 top-full hidden group-hover:flex flex-col bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 shadow-xl rounded py-1 w-48 md:w-52 z-50">
                        <button onclick="showNewCanvasPanel()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black flex justify-between items-center">
                            <span>Создать новый</span>
                        </button>
                        <label class="px-3 py-1.5 text-left hover:bg-accent hover:text-black cursor-pointer flex justify-between items-center">
                            <span>Открыть файл</span>
                            <input type="file" id="imageLoader" class="hidden" accept="image/*" onchange="loadImage(event)">
                        </label>
                        <hr class="border-slate-200 dark:border-zinc-800 my-1">
                        <button onclick="openExportModal()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black flex justify-between items-center">
                            <span>Сохранить</span>
                        </button>
                    </div>
                </div>

                <!-- Редактировать -->
                <div class="relative group">
                    <button class="px-2 md:px-3 py-1 rounded hover:bg-slate-100 dark:hover:bg-zinc-900 font-medium">Правка</button>
                    <div class="absolute left-0 top-full hidden group-hover:flex flex-col bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 shadow-xl rounded py-1 w-48 z-50">
                        <button onclick="undo()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black">Отменить</button>
                        <button onclick="redo()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black">Повторить</button>
                        <hr class="border-slate-200 dark:border-zinc-800 my-1">
                        <button onclick="copySelection()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black">Копировать выделение</button>
                        <button onclick="pasteSelection()" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black">Вставить выделение</button>
                        <button onclick="clearSelectionContent()" class="px-3 py-1.5 text-left hover:bg-red-600 text-red-600 dark:text-red-300 hover:text-white">Удалить выделенное</button>
                        <hr class="border-slate-200 dark:border-zinc-800 my-1">
                        <button onclick="clearCurrentLayer()" class="px-3 py-1.5 text-left hover:bg-red-600 text-red-600 dark:text-red-300 hover:text-white">Очистить слой</button>
                    </div>
                </div>

                <!-- Фильтры -->
                <div class="relative group">
                    <button class="px-2 md:px-3 py-1 rounded hover:bg-slate-100 dark:hover:bg-zinc-900 font-medium">Фильтры</button>
                    <div class="absolute left-0 top-full hidden group-hover:flex flex-col bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 shadow-xl rounded py-1 w-48 z-50">
                        <button onclick="applyFilter('invert')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black">Инверсия</button>
                        <button onclick="applyFilter('grayscale')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black">Черно-белое</button>
                        <button onclick="applyFilter('sepia')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black">Сепия</button>
                        <hr class="border-slate-200 dark:border-zinc-800 my-1">
                        <button onclick="flipCanvas('h')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black">Отразить горизонтально</button>
                        <button onclick="flipCanvas('v')" class="px-3 py-1.5 text-left hover:bg-accent hover:text-black">Отразить вертикально</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопки быстрых действий -->
        <div class="flex items-center space-x-1 md:space-x-2">
            <button onclick="undo()" title="Отмена" class="p-1.5 hover:bg-slate-100 dark:hover:bg-zinc-900 rounded text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button onclick="redo()" title="Повтор" class="p-1.5 hover:bg-slate-100 dark:hover:bg-zinc-900 rounded text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            
            <!-- Кнопка мобильного вызова панели слоев -->
            <button onclick="toggleMobileSidebar()" class="md:hidden p-1.5 hover:bg-slate-100 dark:hover:bg-zinc-900 rounded text-accent">
                <i class="fa-solid fa-layer-group text-lg"></i>
            </button>

            <button onclick="openExportModal()" class="ml-1 md:ml-2 bg-accent hover:bg-accent-hover text-black px-3 md:px-4 py-1.5 rounded font-extrabold text-xs flex items-center space-x-1 shadow-md shadow-[#77C440]/20">
                <i class="fa-solid fa-download"></i>
                <span class="hidden sm:inline">Экспорт</span>
            </button>
        </div>
    </header>

    <!-- ПАНЕЛЬ СВОЙСТВ ИНСТРУМЕНТА -->
    <div class="bg-white dark:bg-zinc-950 border-b border-slate-200 dark:border-zinc-900 px-3 py-2 text-xs flex items-center space-x-4 md:space-x-6 text-slate-700 dark:text-slate-300 z-10 w-full overflow-x-auto whitespace-nowrap transition-colors duration-200">
        <!-- Кисть / Ластик настройки -->
        <div class="flex items-center space-x-2">
            <span class="text-slate-500 dark:text-zinc-400">Размер:</span>
            <input type="range" id="brushSize" min="1" max="100" value="10" class="w-20 md:w-24 accent-accent">
            <span id="brushSizeVal" class="w-8 text-slate-500 dark:text-zinc-400">10px</span>
        </div>

        <div class="flex items-center space-x-2">
            <span class="text-slate-500 dark:text-zinc-400">Прозрачность:</span>
            <input type="range" id="brushOpacity" min="1" max="100" value="100" class="w-20 md:w-24 accent-accent">
            <span id="brushOpacityVal" class="w-8 text-slate-500 dark:text-zinc-400">100%</span>
        </div>

        <!-- Размеры холста напрямую -->
        <div class="hidden sm:flex items-center space-x-2 border-l border-slate-300 dark:border-zinc-800 pl-4">
            <span class="text-slate-500 dark:text-zinc-400">Окно:</span>
            <input type="number" id="quickWidth" onchange="resizeCanvasDirectly()" class="w-14 bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded px-1 py-0.5 text-center text-slate-900 dark:text-white">
            <span>×</span>
            <input type="number" id="quickHeight" onchange="resizeCanvasDirectly()" class="w-14 bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded px-1 py-0.5 text-center text-slate-900 dark:text-white">
        </div>

        <!-- Панель управления выделением -->
        <div id="selectionOptions" class="hidden items-center space-x-2 border-l border-slate-300 dark:border-zinc-800 pl-4">
            <button onclick="copySelection()" title="Копировать выделение" class="bg-slate-100 dark:bg-zinc-900 hover:bg-slate-200 dark:hover:bg-zinc-800 text-slate-800 dark:text-zinc-200 px-2 py-1 rounded flex items-center space-x-1 border border-slate-300 dark:border-zinc-800">
                <i class="fa-regular fa-copy"></i>
                <span class="hidden md:inline">Копировать</span>
            </button>
            <button onclick="pasteSelection()" id="pasteBtn" title="Вставить выделенное" class="bg-slate-100 dark:bg-zinc-900 hover:bg-slate-200 dark:hover:bg-zinc-800 text-slate-800 dark:text-zinc-200 px-2 py-1 rounded flex items-center space-x-1 border border-slate-300 dark:border-zinc-800">
                <i class="fa-regular fa-paste"></i>
                <span class="hidden md:inline">Вставить</span>
            </button>
            <button onclick="clearSelection()" title="Сбросить выделение" class="bg-slate-100 dark:bg-zinc-900 hover:bg-red-100 dark:hover:bg-red-950/50 text-slate-700 dark:text-zinc-300 hover:text-red-600 px-2 py-1 rounded border border-slate-300 dark:border-zinc-800">
                <span>Сбросить</span>
            </button>
        </div>

        <!-- Выбор фигурой -->
        <div id="shapeOptions" class="hidden items-center space-x-3 border-l border-slate-300 dark:border-zinc-800 pl-4">
            <div class="flex items-center space-x-1">
                <span class="text-slate-500 dark:text-zinc-400">Фигура:</span>
                <select id="shapeType" class="bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded px-2 py-1 text-slate-900 dark:text-white focus:outline-none">
                    <option value="rect">Прямоугольник</option>
                    <option value="circle">Круг</option>
                    <option value="line">Линия</option>
                    <option value="arrow">Стрелка</option>
                    <option value="star">Звезда</option>
                </select>
            </div>
            <div class="flex items-center space-x-1">
                <span class="text-slate-500 dark:text-zinc-400">Заливка:</span>
                <input type="checkbox" id="fillShape" class="rounded accent-accent w-4 h-4">
            </div>
        </div>

        <!-- Панель ввода текста -->
        <div id="textOptions" class="hidden items-center space-x-2 border-l border-slate-300 dark:border-zinc-800 pl-4">
            <span class="text-slate-500 dark:text-zinc-400">Текст:</span>
            <input type="text" id="textInput" placeholder="Введите текст..." class="bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded px-2 py-1 text-slate-900 dark:text-white w-28 md:w-36 focus:outline-none">
            <span class="text-slate-500 dark:text-zinc-400">Размер:</span>
            <input type="number" id="fontSize" value="24" class="w-12 bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded px-1 py-1 text-slate-900 dark:text-white">
        </div>

        <!-- ПАНЕЛЬ СОЗДАНИЯ ХОЛСТА -->
        <div id="newCanvasPanel" class="hidden items-center space-x-2 border-l border-slate-300 dark:border-zinc-800 pl-4 bg-slate-200/90 dark:bg-zinc-900 p-1 rounded">
            <span class="text-slate-500 dark:text-zinc-400">Ширина:</span>
            <input type="number" id="newCanvasW" value="1200" class="w-16 bg-white dark:bg-black border border-slate-300 dark:border-zinc-800 rounded px-1 py-0.5 text-slate-900 dark:text-white">
            <span class="text-slate-500 dark:text-zinc-400">Высота:</span>
            <input type="number" id="newCanvasH" value="800" class="w-16 bg-white dark:bg-black border border-slate-300 dark:border-zinc-800 rounded px-1 py-0.5 text-slate-900 dark:text-white">
            <span class="text-slate-500 dark:text-zinc-400">Фон:</span>
            <select id="newCanvasBg" class="bg-white dark:bg-black border border-slate-300 dark:border-zinc-800 rounded px-1 py-0.5 text-slate-900 dark:text-white">
                <option value="white" selected>Белый</option>
                <option value="transparent">Прозрачный</option>
            </select>
            <button onclick="confirmNewCanvas()" class="bg-accent hover:bg-accent-hover text-black font-bold px-2 py-0.5 rounded">Создать</button>
            <button onclick="hideNewCanvasPanel()" class="text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white px-1">✕</button>
        </div>

        <!-- Информация о холсте -->
        <div class="ml-auto flex items-center space-x-3 md:space-x-4 text-slate-500 dark:text-zinc-400 text-xs">
            <span id="canvasDim" class="hidden md:inline">1200 x 800 px</span>
            <div class="flex items-center space-x-1 border-l border-slate-300 dark:border-zinc-800 pl-3">
                <button onclick="zoomOut()" title="Отдалить" class="hover:text-slate-900 dark:hover:text-white px-1"><i class="fa-solid fa-minus"></i></button>
                <span id="zoomVal" class="w-10 text-center">100%</span>
                <button onclick="zoomIn()" title="Приблизить" class="hover:text-slate-900 dark:hover:text-white px-1"><i class="fa-solid fa-plus"></i></button>
                <button onclick="resetZoom()" title="Сбросить масштаб" class="hover:text-slate-900 dark:hover:text-white px-1 ml-1"><i class="fa-solid fa-expand"></i></button>
            </div>
            <span id="cursorPos" class="hidden md:inline">X: 0, Y: 0</span>
        </div>
    </div>

    <!-- ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative w-full">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ ИНСТРУМЕНТОВ -->
        <aside id="leftSidebar" class="w-full md:w-14 bg-white dark:bg-black border-b md:border-b-0 md:border-r border-slate-200 dark:border-zinc-900 flex md:flex-col items-center justify-start py-2 md:py-3 px-2 md:px-2 space-x-2 md:space-x-0 md:space-y-2 z-10 select-none transition-colors duration-200 overflow-x-auto md:overflow-x-visible shrink-0 relative">
            <button onclick="setTool('move')" id="tool-move" title="Перемещение слоя" class="btn-tool active min-w-[36px] w-9 h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center hover:bg-slate-100 dark:hover:bg-zinc-900 text-slate-600 dark:text-slate-300">
                <i class="fa-solid fa-arrows-up-down-left-right text-base"></i>
            </button>
            <button onclick="setTool('select')" id="tool-select" title="Выделение" class="btn-tool min-w-[36px] w-9 h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center hover:bg-slate-100 dark:hover:bg-zinc-900 text-slate-600 dark:text-slate-300">
                <i class="fa-regular fa-square text-base"></i>
            </button>
            <button onclick="setTool('pencil')" id="tool-pencil" title="Карандаш (пиксельный)" class="btn-tool min-w-[36px] w-9 h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center hover:bg-slate-100 dark:hover:bg-zinc-900 text-slate-600 dark:text-slate-300">
                <i class="fa-solid fa-pencil text-base"></i>
            </button>
            <button onclick="setTool('brush')" id="tool-brush" title="Кисть" class="btn-tool min-w-[36px] w-9 h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center hover:bg-slate-100 dark:hover:bg-zinc-900 text-slate-600 dark:text-slate-300">
                <i class="fa-solid fa-paint-brush text-base"></i>
            </button>
            <button onclick="setTool('eraser')" id="tool-eraser" title="Ластик" class="btn-tool min-w-[36px] w-9 h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center hover:bg-slate-100 dark:hover:bg-zinc-900 text-slate-600 dark:text-slate-300">

    <!-- JS ЛОГИКА ПРИЛОЖЕНИЯ -->
    <script>
        let canvasWidth = 1200;
        let canvasHeight = 800;
        let zoomLevel = 1.0;
        let layers = [];
        let activeLayerIndex = -1;
        let currentTool = 'move';
        let isDrawing = false;
        let startX = 0, startY = 0;
        let dragImageData = null;
        let undoStack = [];
        let redoStack = [];
        const MAX_UNDO = 20;

        // Изменение размера окон/холста с помощью краев (Resizing window handle logic)
        let isResizingCanvas = false;
        let resizeDir = null;
        let initialCanvasW = 0, initialCanvasH = 0;
        let resizeStartX = 0, resizeStartY = 0;

        let activeSelection = null;
        let selectionBuffer = null;
        let isSelecting = false;

        let previewCanvas = null;
        let previewCtx = null;

        const viewport = document.getElementById('viewport');
        const container = document.getElementById('canvasContainer');
        const wrapper = document.getElementById('canvasWrapper');
        const brushSizeInput = document.getElementById('brushSize');
        const brushOpacityInput = document.getElementById('brushOpacity');
        const primaryColorInput = document.getElementById('primaryColor');
        const secondaryColorInput = document.getElementById('secondaryColor');

        window.onload = () => {
            initCanvas(1200, 800, 'white');
            setupEventListeners();
            setupCanvasResizers();
            setupSidebarResizers();
        };

        function setupEventListeners() {
            // Регистрация интерактивных событий мыши и тач-событий для холста
            viewport.addEventListener('mousedown', (e) => {
                if (e.target.closest('#canvasContainer')) {
                    startDrawing(getEventPoint(e));
                }
            });

            viewport.addEventListener('mousemove', (e) => {
                const pt = getEventPoint(e);
                draw(pt);
            });

            window.addEventListener('mouseup', (e) => {
                stopDrawing(e);
            });

            // Поддержка Touch для мобильных устройств
            viewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && e.target.closest('#canvasContainer')) {
                    startDrawing(getEventPoint(e));
                }
            }, { passive: false });

            viewport.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isDrawing) {
                    draw(getEventPoint(e));
                    e.preventDefault();
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                stopDrawing(e);
            });

            // Изменение параметров кисти из верхней панели
            brushSizeInput.addEventListener('input', (e) => {
                document.getElementById('brushSizeVal').innerText = e.target.value + 'px';
            });

            brushOpacityInput.addEventListener('input', (e) => {
                document.getElementById('brushOpacityVal').innerText = e.target.value + '%';
            });
        }

        /* Растяжение панелей ПК (Sidebar Resizers) */
        function setupSidebarResizers() {
            const leftSidebar = document.getElementById('leftSidebar');
            const leftResizer = document.getElementById('leftResizer');
            const rightSidebar = document.getElementById('mobileSidebar');
            const rightResizer = document.getElementById('rightResizer');

            let isResizingLeft = false;
            let isResizingRight = false;

            if (leftResizer) {
                leftResizer.addEventListener('mousedown', (e) => {
                    isResizingLeft = true;
                    leftResizer.classList.add('resizing');
                    document.body.style.cursor = 'col-resize';
                });
            }

            if (rightResizer) {
                rightResizer.addEventListener('mousedown', (e) => {
                    isResizingRight = true;
                    rightResizer.classList.add('resizing');
                    document.body.style.cursor = 'col-resize';
                });
            }

            window.addEventListener('mousemove', (e) => {
                if (isResizingLeft && window.innerWidth > 768) {
                    const newWidth = Math.max(50, Math.min(300, e.clientX));
                    leftSidebar.style.width = `${newWidth}px`;
                }
                if (isResizingRight && window.innerWidth > 768) {
                    const newWidth = Math.max(180, Math.min(600, window.innerWidth - e.clientX));
                    rightSidebar.style.width = `${newWidth}px`;
                }
            });

            window.addEventListener('mouseup', () => {
                if (isResizingLeft) {
                    isResizingLeft = false;
                    leftResizer.classList.remove('resizing');
                }
                if (isResizingRight) {
                    isResizingRight = false;
                    rightResizer.classList.remove('resizing');
                }
                document.body.style.cursor = 'default';
            });
        }

        /* Настройка интерактивных маркеров растяжения окон */
        function setupCanvasResizers() {
            const handles = document.querySelectorAll('.resize-handle');

            handles.forEach(handle => {
                const onPointerDown = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    isResizingCanvas = true;
                    resizeDir = handle.getAttribute('data-dir');
                    initialCanvasW = canvasWidth;
                    initialCanvasH = canvasHeight;
                    const pt = getEventPoint(e);
                    resizeStartX = pt.clientX;
                    resizeStartY = pt.clientY;
                };

                handle.addEventListener('mousedown', onPointerDown);
                handle.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) onPointerDown(e.touches[0]);
                }, { passive: false });
            });

            const onPointerMove = (e) => {
                if (!isResizingCanvas) return;
                const pt = getEventPoint(e);
                const dx = (pt.clientX - resizeStartX) / zoomLevel;
                const dy = (pt.clientY - resizeStartY) / zoomLevel;

                let newW = initialCanvasW;
                let newH = initialCanvasH;

                if (resizeDir.includes('e')) newW = Math.max(50, Math.round(initialCanvasW + dx));
                if (resizeDir.includes('s')) newH = Math.max(50, Math.round(initialCanvasH + dy));
                if (resizeDir.includes('w')) newW = Math.max(50, Math.round(initialCanvasW - dx));
                if (resizeDir.includes('n')) newH = Math.max(50, Math.round(initialCanvasH - dy));

                if (newW !== canvasWidth || newH !== canvasHeight) {
                    resizeCanvasTo(newW, newH);
                }
            };

            const onPointerUp = () => {
                if (isResizingCanvas) {
                    isResizingCanvas = false;
                    saveState();
                }
            };

            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('touchmove', (e) => {
                if (isResizingCanvas && e.touches.length === 1) onPointerMove(e.touches[0]);
            });
            window.addEventListener('touchend', onPointerUp);
        }

        function resizeCanvasTo(newWidth, newHeight) {
            const oldWidth = canvasWidth;
            const oldHeight = canvasHeight;

            canvasWidth = newWidth;
            canvasHeight = newHeight;

            layers.forEach(layer => {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = oldWidth;
                tempCanvas.height = oldHeight;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(layer.canvas, 0, 0);

                layer.canvas.width = canvasWidth;
                layer.canvas.height = canvasHeight;
                layer.ctx.drawImage(tempCanvas, 0, 0);
            });

            if (previewCanvas) {
                previewCanvas.width = canvasWidth;
                previewCanvas.height = canvasHeight;
            }

            updateContainerSize();
            updateDimensionInputs();
        }

        function resizeCanvasDirectly() {
            const w = parseInt(document.getElementById('quickWidth').value);
            const h = parseInt(document.getElementById('quickHeight').value);
            if (w > 10 && h > 10) {
                resizeCanvasTo(w, h);
                saveState();
            }
        }

        function updateDimensionInputs() {
            document.getElementById('canvasDim').innerText = `${canvasWidth} x ${canvasHeight} px`;
            document.getElementById('quickWidth').value = canvasWidth;
            document.getElementById('quickHeight').value = canvasHeight;
        }

        function getEventPoint(e) {
            return {
                clientX: e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0),
                clientY: e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0)
            };
        }

        function initCanvas(w, h, bgType = 'transparent') {
            canvasWidth = w;
            canvasHeight = h;
            
            if (window.innerWidth <= 768) {
                zoomLevel = Math.min(0.8, (window.innerWidth - 40) / w);
            } else if (w <= 128 || h <= 128) {
                zoomLevel = Math.max(4, Math.min(16, Math.floor(600 / Math.max(w, h))));
            } else {
                zoomLevel = 1.0;
            }
            
            updateContainerSize();
            updateDimensionInputs();

            container.innerHTML = '';
            layers = [];
            undoStack = [];
            redoStack = [];
            activeSelection = null;
            selectionBuffer = null;

            addNewLayer('Слой 1', bgType === 'white');

            previewCanvas = document.createElement('canvas');
            previewCanvas.width = canvasWidth;
            previewCanvas.height = canvasHeight;
            previewCanvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none z-30';
            previewCtx = previewCanvas.getContext('2d');
            container.appendChild(previewCanvas);

            saveState();
        }

        function updateContainerSize() {
            container.style.width = (canvasWidth * zoomLevel) + 'px';
            container.style.height = (canvasHeight * zoomLevel) + 'px';
            wrapper.style.width = (canvasWidth * zoomLevel) + 'px';
            wrapper.style.height = (canvasHeight * zoomLevel) + 'px';
            document.getElementById('zoomVal').innerText = Math.round(zoomLevel * 100) + '%';
        }

        function zoomIn() {
            zoomLevel = Math.min(32, zoomLevel * 1.25);
            updateContainerSize();
        }

        function zoomOut() {
            zoomLevel = Math.max(0.1, zoomLevel / 1.25);
            updateContainerSize();
        }

        function resetZoom() {
            zoomLevel = 1.0;
            updateContainerSize();
        }

        function addNewLayer(name = null, isWhiteBackground = false) {
            const layerCanvas = document.createElement('canvas');
            layerCanvas.width = canvasWidth;
            layerCanvas.height = canvasHeight;
            layerCanvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none';
            layerCanvas.style.width = '100%';
            layerCanvas.style.height = '100%';
            layerCanvas.style.imageRendering = zoomLevel >= 4 ? 'pixelated' : 'auto';
            
            const ctx = layerCanvas.getContext('2d');
            if (isWhiteBackground) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            }

            const layer = {
                id: Date.now() + Math.random(),
                name: name || `Слой ${layers.length + 1}`,
                canvas: layerCanvas,
                ctx: ctx,
                visible: true,
                opacity: 1,
                blendMode: 'normal'
            };

            layers.push(layer);
            
            if (previewCanvas && previewCanvas.parentNode === container) {
                container.insertBefore(layerCanvas, previewCanvas);
            } else {
                container.appendChild(layerCanvas);
            }

            setActiveLayer(layers.length - 1);
            renderLayersControl();
        }

        function setActiveLayer(index) {
            if (index >= 0 && index < layers.length) {
                activeLayerIndex = index;
                renderLayersControl();
                updateLayerControlsUI();
            }
        }

        function renderLayersControl() {
            const list = document.getElementById('layersList');
            list.innerHTML = '';

            for (let i = layers.length - 1; i >= 0; i--) {
                const layer = layers[i];
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2.5 rounded-lg cursor-pointer border ${
                    i === activeLayerIndex 
                        ? 'bg-accent/20 border-accent text-slate-900 dark:text-white font-medium' 
                        : 'bg-slate-50 dark:bg-zinc-900 border-slate-200 dark:border-zinc-800 text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800'
                }`;
                item.onclick = () => setActiveLayer(i);

                item.innerHTML = `
                    <div class="flex items-center space-x-2.5 truncate">
                        <button onclick="toggleLayerVisibility(${i}, event)" class="hover:text-slate-900 dark:hover:text-white">
                            <i class="fa-solid ${layer.visible ? 'fa-eye' : 'fa-eye-slash text-slate-400 dark:text-zinc-600'}"></i>
                        </button>
                        <span class="text-xs truncate">${layer.name}</span>
                    </div>
                    <span class="text-xs text-slate-400 dark:text-zinc-500">${Math.round(layer.opacity * 100)}%</span>
                `;
                list.appendChild(item);
            }
        }

        function renderSelection() {
            if (!previewCtx) return;
            previewCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            if (activeSelection) {
                const { x, y, width, height } = activeSelection;
                
                previewCtx.save();
                previewCtx.strokeStyle = '#3b82f6';
                previewCtx.lineWidth = Math.max(1, 2 / zoomLevel);
                previewCtx.setLineDash([6 / zoomLevel, 6 / zoomLevel]);
                previewCtx.strokeRect(x, y, width, height);

                previewCtx.fillStyle = 'rgba(59, 130, 246, 0.12)';
                previewCtx.fillRect(x, y, width, height);

                previewCtx.restore();
            }
        }

        function clearSelection() {
            activeSelection = null;
            renderSelection();
        }

        function clearSelectionContent() {
            if (!activeSelection || activeLayerIndex < 0) return;
            const ctx = layers[activeLayerIndex].ctx;
            ctx.clearRect(activeSelection.x, activeSelection.y, activeSelection.width, activeSelection.height);
            saveState();
        }

        function copySelection() {
            if (!activeSelection || activeLayerIndex < 0) return;
            const ctx = layers[activeLayerIndex].ctx;
            const { x, y, width, height } = activeSelection;
            if (width > 0 && height > 0) {
                selectionBuffer = ctx.getImageData(x, y, width, height);
            }
        }

        function pasteSelection() {
            if (!selectionBuffer) return;
            
            addNewLayer('Вставленный фрагмент');
            const newCtx = layers[activeLayerIndex].ctx;
            
            const pasteX = activeSelection ? activeSelection.x : Math.max(0, (canvasWidth - selectionBuffer.width) / 2);
            const pasteY = activeSelection ? activeSelection.y : Math.max(0, (canvasHeight - selectionBuffer.height) / 2);

            newCtx.putImageData(selectionBuffer, pasteX, pasteY);
            
            activeSelection = {
                x: pasteX,
                y: pasteY,
                width: selectionBuffer.width,
                height: selectionBuffer.height
            };
            
            renderSelection();
            saveState();
        }

        function startDrawing(ePt) {
            if (activeLayerIndex < 0 || !layers[activeLayerIndex].visible) return;
            
            const pos = getCanvasCoordinates(ePt);
            if (pos.x < 0 || pos.x > canvasWidth || pos.y < 0 || pos.y > canvasHeight) return;

            isDrawing = true;
            startX = pos.x;
            startY = pos.y;

            const ctx = layers[activeLayerIndex].ctx;

            if (currentTool === 'select') {
                isSelecting = true;
            } else if (currentTool === 'move') {
                dragImageData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            } else if (currentTool === 'picker') {
                pickColor(pos.x, pos.y);
                isDrawing = false;
            } else if (currentTool === 'bucket') {
                floodFill(Math.floor(pos.x), Math.floor(pos.y), primaryColorInput.value);
                isDrawing = false;
                saveState();
            } else if (currentTool === 'text') {
                drawTextToCanvas(pos.x, pos.y);
                isDrawing = false;
            } else if (currentTool === 'pencil') {
                drawPixel(ctx, Math.floor(pos.x), Math.floor(pos.y));
            } else if (currentTool === 'brush' || currentTool === 'eraser') {
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }
        }

        function draw(ePt) {
            const pos = getCanvasCoordinates(ePt);
            document.getElementById('cursorPos').innerText = `X: ${Math.round(pos.x)}, Y: ${Math.round(pos.y)}`;

            if (!isDrawing || activeLayerIndex < 0) return;

            const ctx = layers[activeLayerIndex].ctx;
            const size = parseFloat(brushSizeInput.value);
            const opacity = brushOpacityInput.value / 100;
            const color = primaryColorInput.value;

            if (currentTool === 'select') {
                if (isSelecting) {
                    const w = pos.x - startX;
                    const h = pos.y - startY;
                    activeSelection = {
                        x: Math.min(startX, pos.x),
                        y: Math.min(startY, pos.y),
                        width: Math.abs(w),
                        height: Math.abs(h)
                    };
                    renderSelection();
                }
            } else if (currentTool === 'move' && dragImageData) {
                const dx = pos.x - startX;
                const dy = pos.y - startY;
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                ctx.putImageData(dragImageData, dx, dy);
            } else if (currentTool === 'pencil') {
                drawPixel(ctx, Math.floor(pos.x), Math.floor(pos.y));
            } else if (currentTool === 'brush') {
                ctx.globalAlpha = opacity;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentTool === 'eraser') {
                ctx.globalAlpha = opacity;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = size;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentTool === 'shapes') {
                previewCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                if (activeSelection) renderSelection();
                drawShapeOnContext(previewCtx, startX, startY, pos.x, pos.y);
            }
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;

            if (currentTool === 'select') {
                isSelecting = false;
                renderSelection();
            } else if (activeLayerIndex >= 0) {
                const ctx = layers[activeLayerIndex].ctx;
                ctx.globalCompositeOperation = 'source-over';

                if (currentTool === 'shapes' && e) {
                    const ePt = getEventPoint(e);
                    const pos = getCanvasCoordinates(ePt);
                    previewCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                    renderSelection();
                    drawShapeOnContext(ctx, startX, startY, pos.x, pos.y);
                }
            }

            dragImageData = null;
            saveState();
        }

        function drawPixel(ctx, x, y) {
            const size = Math.max(1, parseInt(brushSizeInput.value));
            const opacity = brushOpacityInput.value / 100;
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.fillStyle = primaryColorInput.value;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillRect(x - Math.floor(size / 2), y - Math.floor(size / 2), size, size);
            ctx.restore();
        }

        function restoreState(state) {
            container.innerHTML = '';
            layers = [];

            state.forEach((s) => {
                const layerCanvas = document.createElement('canvas');
                layerCanvas.width = canvasWidth;
                layerCanvas.height = canvasHeight;
                layerCanvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none';
                layerCanvas.style.width = '100%';
                layerCanvas.style.height = '100%';
                layerCanvas.style.imageRendering = zoomLevel >= 4 ? 'pixelated' : 'auto';
                layerCanvas.style.opacity = s.opacity;
                layerCanvas.style.mixBlendMode = s.blendMode;
                layerCanvas.style.display = s.visible ? 'block' : 'none';

                const ctx = layerCanvas.getContext('2d');
                ctx.putImageData(s.data, 0, 0);

                const layer = {
                    id: s.id,
                    name: s.name,
                    canvas: layerCanvas,
                    ctx: ctx,
                    visible: s.visible,
                    opacity: s.opacity,
                    blendMode: s.blendMode
                };

                layers.push(layer);
                container.appendChild(layerCanvas);
            });

            previewCanvas = document.createElement('canvas');
            previewCanvas.width = canvasWidth;
            previewCanvas.height = canvasHeight;
            previewCanvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none z-30';
            previewCtx = previewCanvas.getContext('2d');
            container.appendChild(previewCanvas);

            activeLayerIndex = Math.min(activeLayerIndex, layers.length - 1);
            renderLayersControl();
            renderSelection();
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`tool-${tool}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('selectionOptions').style.display = (tool === 'select') ? 'flex' : 'none';
            document.getElementById('shapeOptions').style.display = (tool === 'shapes') ? 'flex' : 'none';
            document.getElementById('textOptions').style.display = (tool === 'text') ? 'flex' : 'none';
        }

        function toggleLayerVisibility(index, e) {
            e.stopPropagation();
            layers[index].visible = !layers[index].visible;
            layers[index].canvas.style.display = layers[index].visible ? 'block' : 'none';
            renderLayersControl();
        }

        function updateLayerControlsUI() {
            if (activeLayerIndex < 0) return;
            const layer = layers[activeLayerIndex];
            document.getElementById('layerOpacity').value = layer.opacity * 100;
            document.getElementById('layerOpacityVal').innerText = Math.round(layer.opacity * 100) + '%';
            document.getElementById('blendMode').value = layer.blendMode;
        }

        function updateLayerOpacity(val) {
            if (activeLayerIndex < 0) return;
            const opacity = val / 100;
            layers[activeLayerIndex].opacity = opacity;
            layers[activeLayerIndex].canvas.style.opacity = opacity;
            document.getElementById('layerOpacityVal').innerText = val + '%';
            renderLayersControl();
        }

        function updateLayerBlendMode(val) {
            if (activeLayerIndex < 0) return;
            layers[activeLayerIndex].blendMode = val;
            layers[activeLayerIndex].canvas.style.mixBlendMode = val;
        }

        function moveLayerUp() {
            if (activeLayerIndex < layers.length - 1) {
                const temp = layers[activeLayerIndex];
                layers[activeLayerIndex] = layers[activeLayerIndex + 1];
                layers[activeLayerIndex + 1] = temp;
                reorderCanvasDOM();
                setActiveLayer(activeLayerIndex + 1);
            }
        }

        function moveLayerDown() {
            if (activeLayerIndex > 0) {
                const temp = layers[activeLayerIndex];
                layers[activeLayerIndex] = layers[activeLayerIndex - 1];
                layers[activeLayerIndex - 1] = temp;
                reorderCanvasDOM();
                setActiveLayer(activeLayerIndex - 1);
            }
        }

        function reorderCanvasDOM() {
            layers.forEach(l => container.appendChild(l.canvas));
            if (previewCanvas) container.appendChild(previewCanvas);
        }

        function deleteActiveLayer() {
            if (layers.length <= 1) return;
            container.removeChild(layers[activeLayerIndex].canvas);
            layers.splice(activeLayerIndex, 1);
            setActiveLayer(Math.max(0, activeLayerIndex - 1));
            saveState();
        }

        function duplicateActiveLayer() {
            if (activeLayerIndex < 0) return;
            const src = layers[activeLayerIndex];
            addNewLayer(`${src.name} дубликат`);
            const dest = layers[activeLayerIndex];
            dest.ctx.drawImage(src.canvas, 0, 0);
            saveState();
        }

        function swapColors() {
            const temp = primaryColorInput.value;
            primaryColorInput.value = secondaryColorInput.value;
            secondaryColorInput.value = temp;
        }

        function getCanvasCoordinates(ePt) {
            const rect = container.getBoundingClientRect();
            const clientX = ePt.clientX - rect.left;
            const clientY = ePt.clientY - rect.top;

            const x = clientX / zoomLevel;
            const y = clientY / zoomLevel;

            return { x, y };
        }

        function drawShapeOnContext(targetCtx, x1, y1, x2, y2) {
            const shapeType = document.getElementById('shapeType').value;
            const fill = document.getElementById('fillShape').checked;
            const color = primaryColorInput.value;
            const size = parseFloat(brushSizeInput.value);
            const opacity = brushOpacityInput.value / 100;

            targetCtx.save();
            targetCtx.globalAlpha = opacity;
            targetCtx.strokeStyle = color;
            targetCtx.fillStyle = color;
            targetCtx.lineWidth = size;
            targetCtx.lineCap = 'round';

            const w = x2 - x1;
            const h = y2 - y1;

            targetCtx.beginPath();

            if (shapeType === 'rect') {
                if (fill) targetCtx.fillRect(x1, y1, w, h);
                else targetCtx.strokeRect(x1, y1, w, h);
            } else if (shapeType === 'circle') {
                const rx = Math.abs(w) / 2;
                const ry = Math.abs(h) / 2;
                const cx = x1 + w / 2;
                const cy = y1 + h / 2;
                targetCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                if (fill) targetCtx.fill();
                else targetCtx.stroke();
            } else if (shapeType === 'line') {
                targetCtx.moveTo(x1, y1);
                targetCtx.lineTo(x2, y2);
                targetCtx.stroke();
            } else if (shapeType === 'arrow') {
                const headlen = Math.max(10, size * 2);
                const angle = Math.atan2(y2 - y1, x2 - x1);
                targetCtx.moveTo(x1, y1);
                targetCtx.lineTo(x2, y2);
                targetCtx.stroke();
                
                targetCtx.beginPath();
                targetCtx.moveTo(x2, y2);
                targetCtx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
                targetCtx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
                targetCtx.closePath();
                targetCtx.fill();
            } else if (shapeType === 'star') {
                const cx = x1 + w / 2;
                const cy = y1 + h / 2;
                const outerRadius = Math.min(Math.abs(w), Math.abs(h)) / 2;
                const innerRadius = outerRadius / 2;
                const spikes = 5;

                let rot = Math.PI / 2 * 3;
                let step = Math.PI / spikes;

                targetCtx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    targetCtx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                    rot += step;
                    targetCtx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                    rot += step;
                }
                targetCtx.lineTo(cx, cy - outerRadius);
                targetCtx.closePath();

                if (fill) targetCtx.fill();
                else targetCtx.stroke();
            }

            targetCtx.restore();
        }

        function drawTextToCanvas(x, y) {
            const text = document.getElementById('textInput').value;
            const fontSize = document.getElementById('fontSize').value || 24;
            if (!text) return;

            const ctx = layers[activeLayerIndex].ctx;
            ctx.font = `${fontSize}px Inter, sans-serif`;
            ctx.fillStyle = primaryColorInput.value;
            ctx.globalAlpha = brushOpacityInput.value / 100;
            ctx.fillText(text, x, y);
            saveState();
        }

        function floodFill(startX, startY, fillColorHex) {
            const ctx = layers[activeLayerIndex].ctx;
            const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            const data = imgData.data;

            const targetPos = (startY * canvasWidth + startX) * 4;
            const startR = data[targetPos];
            const startG = data[targetPos + 1];
            const startB = data[targetPos + 2];
            const startA = data[targetPos + 3];

            const r = parseInt(fillColorHex.slice(1, 3), 16);
            const g = parseInt(fillColorHex.slice(3, 5), 16);
            const b = parseInt(fillColorHex.slice(5, 7), 16);

            if (startR === r && startG === g && startB === b && startA === 255) return;

            const pixelStack = [[startX, startY]];

            while (pixelStack.length) {
                const newPos = pixelStack.pop();
                const x = newPos[0];
                let y = newPos[1];

                let pixelPos = (y * canvasWidth + x) * 4;
                while (y >= 0 && matchStartColor(pixelPos)) {
                    y--;
                    pixelPos -= canvasWidth * 4;
                }
                pixelPos += canvasWidth * 4;
                y++;

                let reachLeft = false;
                let reachRight = false;

                while (y < canvasHeight && matchStartColor(pixelPos)) {
                    colorPixel(pixelPos, r, g, b);

                    if (x > 0) {
                        if (matchStartColor(pixelPos - 4)) {
                            if (!reachLeft) {
                                pixelStack.push([x - 1, y]);
                                reachLeft = true;
                            }
                        } else if (reachLeft) {
                            reachLeft = false;
                        }
                    }

                    if (x < canvasWidth - 1) {
                        if (matchStartColor(pixelPos + 4)) {
                            if (!reachRight) {
                                pixelStack.push([x + 1, y]);
                                reachRight = true;
                            }
                        } else if (reachRight) {
                            reachRight = false;
                        }
                    }

                    y++;
                    pixelPos += canvasWidth * 4;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            function matchStartColor(pixelPos) {
                return data[pixelPos] === startR &&
                       data[pixelPos + 1] === startG &&
                       data[pixelPos + 2] === startB &&
                       data[pixelPos + 3] === startA;
            }

            function colorPixel(pixelPos, r, g, b) {
                data[pixelPos] = r;
                data[pixelPos + 1] = g;
                data[pixelPos + 2] = b;
                data[pixelPos + 3] = 255;
            }
        }

        function pickColor(x, y) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasWidth;
            tempCanvas.height = canvasHeight;
            const tempCtx = tempCanvas.getContext('2d');

            layers.forEach(layer => {
                if (layer.visible) tempCtx.drawImage(layer.canvas, 0, 0);
            });

            const pixel = tempCtx.getImageData(x, y, 1, 1).data;
            const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
            primaryColorInput.value = hex;
        }

        function applyFilter(filterType) {
            if (activeLayerIndex < 0) return;
            const ctx = layers[activeLayerIndex].ctx;
            const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                if (filterType === 'invert') {
                    data[i] = 255 - data[i];
                    data[i + 1] = 255 - data[i + 1];
                    data[i + 2] = 255 - data[i + 2];
                } else if (filterType === 'grayscale') {
                    const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    data[i] = avg;
                    data[i + 1] = avg;
                    data[i + 2] = avg;
                } else if (filterType === 'sepia') {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    data[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    data[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    data[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                }
            }

            ctx.putImageData(imgData, 0, 0);
            saveState();
        }

        function flipCanvas(direction) {
            if (activeLayerIndex < 0) return;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasWidth;
            tempCanvas.height = canvasHeight;
            const tempCtx = tempCanvas.getContext('2d');
            
            const ctx = layers[activeLayerIndex].ctx;
            tempCtx.drawImage(layers[activeLayerIndex].canvas, 0, 0);

            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.save();
            if (direction === 'h') {
                ctx.scale(-1, 1);
                ctx.drawImage(tempCanvas, -canvasWidth, 0);
            } else {
                ctx.scale(1, -1);
                ctx.drawImage(tempCanvas, 0, -canvasHeight);
            }
            ctx.restore();
            saveState();
        }

        function loadImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    initCanvas(img.width, img.height, 'transparent');
                    layers[0].ctx.drawImage(img, 0, 0);
                    saveState();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function clearCurrentLayer() {
            if (activeLayerIndex < 0) return;
            layers[activeLayerIndex].ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            saveState();
        }

        function saveState() {
            if (undoStack.length >= MAX_UNDO) undoStack.shift();
            
            const snapshot = layers.map(l => ({
                id: l.id,
                name: l.name,
                visible: l.visible,
                opacity: l.opacity,
                blendMode: l.blendMode,
                data: l.ctx.getImageData(0, 0, canvasWidth, canvasHeight)
            }));

            undoStack.push(snapshot);
            redoStack = [];
        }

        function undo() {
            if (undoStack.length <= 1) return;
            redoStack.push(undoStack.pop());
            restoreState(undoStack[undoStack.length - 1]);
        }

        function redo() {
            if (redoStack.length === 0) return;
            const state = redoStack.pop();
            undoStack.push(state);
            restoreState(state);
        }

        function openExportModal() {
            document.getElementById('exportModal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
        }

        function toggleQualitySlider() {
            const format = document.getElementById('exportFormat').value;
            const container = document.getElementById('qualityContainer');
            container.style.display = (format === 'jpeg' || format === 'webp') ? 'block' : 'none';
        }

        function downloadImage() {
            const format = document.getElementById('exportFormat').value;
            const filename = document.getElementById('exportFileName').value || 'freex-artwork';
            const quality = document.getElementById('exportQuality').value / 100;

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvasWidth;
            exportCanvas.height = canvasHeight;
            const exportCtx = exportCanvas.getContext('2d');

            if (format === 'jpeg') {
                exportCtx.fillStyle = '#ffffff';
                exportCtx.fillRect(0, 0, canvasWidth, canvasHeight);
            }

            layers.forEach(layer => {
                if (layer.visible) {
                    exportCtx.globalAlpha = layer.opacity;
                    exportCtx.globalCompositeOperation = layer.blendMode;
                    exportCtx.drawImage(layer.canvas, 0, 0);
                }
            });

            const link = document.createElement('a');
            const mimeType = `image/${format}`;
            link.download = `${filename}.${format}`;
            link.href = exportCanvas.toDataURL(mimeType, quality);
            link.click();

            closeExportModal();
        }

        function switchTab(tab) {
            const lPanel = document.getElementById('layersPanel');
            const aPanel = document.getElementById('adjustmentPanel');
            const lBtn = document.getElementById('tabLayersBtn');
            const aBtn = document.getElementById('tabAdjBtn');

            if (tab === 'adj') {
                aPanel.classList.remove('hidden');
                lPanel.classList.add('hidden');
                aBtn.className = "flex-1 py-3 bg-slate-50 dark:bg-zinc-950 text-accent border-b-2 border-accent font-semibold";
                lBtn.className = "flex-1 py-3 hover:bg-slate-50 dark:hover:bg-zinc-950 hover:text-slate-800 dark:hover:text-slate-200 text-slate-500 dark:text-zinc-400";
            } else {
                aPanel.classList.add('hidden');
                lPanel.classList.remove('hidden');
                lBtn.className = "flex-1 py-3 bg-slate-50 dark:bg-zinc-950 text-accent border-b-2 border-accent font-semibold";
                aBtn.className = "flex-1 py-3 hover:bg-slate-50 dark:hover:bg-zinc-950 hover:text-slate-800 dark:hover:text-slate-200 text-slate-500 dark:text-zinc-400";
            }
        }

        function applyAdjustments() {
            const b = document.getElementById('adjBrightness').value;
            const c = document.getElementById('adjContrast').value;
            const s = document.getElementById('adjSaturate').value;
            const h = document.getElementById('adjHue').value;

            document.getElementById('brightnessVal').innerText = b;
            document.getElementById('contrastVal').innerText = c;
            document.getElementById('saturateVal').innerText = s;
            document.getElementById('hueVal').innerText = h + '°';

            if (activeLayerIndex >= 0) {
                layers[activeLayerIndex].canvas.style.filter = 
                    `brightness(${100 + parseInt(b)}%) contrast(${100 + parseInt(c)}%) saturate(${100 + parseInt(s)}%) hue-rotate(${h}deg)`;
            }
        }

        function resetAdjustments() {
            document.getElementById('adjBrightness').value = 0;
            document.getElementById('adjContrast').value = 0;
            document.getElementById('adjSaturate').value = 0;
            document.getElementById('adjHue').value = 0;
            applyAdjustments();
        }

        function showNewCanvasPanel() {
            document.getElementById('newCanvasPanel').classList.remove('hidden');
            document.getElementById('newCanvasPanel').classList.add('flex');
        }

        function hideNewCanvasPanel() {
            document.getElementById('newCanvasPanel').classList.add('hidden');
            document.getElementById('newCanvasPanel').classList.remove('flex');
        }

        function confirmNewCanvas() {
            const w = parseInt(document.getElementById('newCanvasW').value) || 1200;
            const h = parseInt(document.getElementById('newCanvasH').value) || 800;
            const bg = document.getElementById('newCanvasBg').value;
            initCanvas(w, h, bg);
            hideNewCanvasPanel();
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('mobileSidebar');
            sidebar.classList.toggle('translate-y-full');
        }
    </script>
</body>
</html>
